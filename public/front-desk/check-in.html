<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\"><title>Check‑In</title><link rel=\"stylesheet\" href=\"../styles.css\"></head><body><nav><ul><li><a href=\"/index.html\">Home</a></li><li><a href=\"/front-desk/check-out.html\">Check‑Out</a></li></ul></nav><main><h1>Check‑In</h1><table id=\"reservations-table\"><thead><tr><th>Reservation ID</th><th>Guest Name</th><th>Room</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody></table></main><script>async function loadReservations(){try{const resp=await fetch('/api/reservations/today');if(!resp.ok)throw new Error('Failed to fetch');const data=await resp.json();const tbody=document.querySelector('#reservations-table tbody');tbody.innerHTML='';data.forEach(r=>{const tr=document.createElement('tr');tr.dataset.id=r.id;tr.innerHTML=`<td>${r.id}</td><td>${r.guestName}</td><td>${r.roomNumber||''}</td><td class=\"status\">${r.status}</td><td>${r.status==='Booked'?'<button class=\"checkin-btn\">Check‑In</button>':''}</td>`;tbody.appendChild(tr);});document.querySelectorAll('.checkin-btn').forEach(btn=>{btn.addEventListener('click',async e=>{const tr=e.target.closest('tr');const reservationId=tr.dataset.id;const res=await fetch('/api/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reservationId})});if(!res.ok){alert('Check‑In failed');return;}const result=await res.json();tr.querySelector('.status').textContent=result.status;tr.cells[2].textContent=result.roomNumber||'';tr.cells[4].innerHTML=result.roomKey?`Key: ${result.roomKey}`:'';});});}catch(err){console.error(err);}}document.addEventListener('DOMContentLoaded',loadReservations);</script></body></html>
